name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    # Pinned, because GitHub's newest Ubuntu image has no Python 3.9 build; 24.04 has
    # builds of both versions tested.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest supported version, and 3.10 is the version on the server.
        python-version: ["3.9", "3.10"]
    steps:
      - uses: actions/checkout@v7
        with:
          # The version is derived from git tags, which a shallow clone doesn't have.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        id: install
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[web,dev]"

      # Every line and branch is covered, so any code without tests fails the build.
      - name: Test with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=100

      # Pylint exits with an error for any message, failing the build. The lint steps run
      # even when tests fail, so that every problem is reported at once.
      - name: Lint source
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pylint src

      - name: Lint tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pylint --rcfile=tests/pylintrc tests
