# Apache configuration serving the Infield Fly web interface at /infield-fly/.
#
# deploy/deploy.sh fills in WEB_PORT, the local port of the web interface, and
# installs this as the file named by APACHE_CONF in deploy/deploy.env. To install it by
# hand, replace WEB_PORT, add these lines inside the HTTPS <VirtualHost *:443> block for
# the site, or a file it includes, then check and reload the configuration:
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2
# Requires mod_proxy and mod_proxy_http, from Apache 2.4.47 or later for WebSockets.

RedirectMatch 301 ^/infield-fly$ /infield-fly/
<Location /infield-fly/>
    # upgrade=websocket passes WebSocket connections, used by the live processing log,
    # through to the web interface.
    ProxyPass http://127.0.0.1:WEB_PORT/ upgrade=websocket
    ProxyPassReverse http://127.0.0.1:WEB_PORT/
    # The web interface refuses form submissions whose Origin does not match the Host
    # header, so the browser's Host header must be passed through unchanged.
    ProxyPreserveHost On
</Location>
