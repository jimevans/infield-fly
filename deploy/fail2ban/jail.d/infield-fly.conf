# fail2ban jail banning addresses with repeated failed logins to the Infield Fly web
# interface. Install as /etc/fail2ban/jail.d/infield-fly.conf, then run:
#   sudo systemctl reload fail2ban
[infield-fly]
enabled = true
backend = systemd
filter = infield-fly
port = http,https
maxretry = 5
findtime = 15m
bantime = 1h
