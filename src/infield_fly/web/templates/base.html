<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Infield Fly</title>
  <link rel="stylesheet" href="{{ app_path(request, 'static', path='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ app_path(request, 'home') }}">Infield Fly</a>
    {% if request.session.get("user") %}
    <nav>
      <a href="{{ app_path(request, 'jobs') }}"{% if active == "jobs" %} aria-current="page"{% endif %}>Jobs</a>
      <a href="{{ app_path(request, 'processing') }}"{% if active == "processing" %} aria-current="page"{% endif %}>Processing</a>
      <a href="{{ app_path(request, 'series') }}"{% if active == "series" %} aria-current="page"{% endif %}>Series</a>
      <a href="{{ app_path(request, 'settings') }}"{% if active == "settings" %} aria-current="page"{% endif %}>Settings</a>
      <form method="post" action="{{ app_path(request, 'logout') }}">
        <button type="submit" class="link-button">Log out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% for kind, message in pop_flashes(request) %}
    <p class="flash flash-{{ kind }}" role="status">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
