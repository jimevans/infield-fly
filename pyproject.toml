[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "infield-fly"
version = "1.0.0"
description = "An ffmpeg wrapper for media file container conversion"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "argcomplete>=3.3,<4",
    "deluge_client==1.9.0",
    "requests>=2.32.4,<3",
    "twilio==7.3.1",
]

[project.optional-dependencies]
web = [
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "python-pam>=2.0.2,<3",
    # python-pam imports six without declaring it as a dependency.
    "six>=1.16,<2",
    "starlette>=0.49,<1",
    "uvicorn>=0.39,<1",
]
dev = [
    "httpx>=0.28,<1",
    "pylint==3.3.9",
    "pytest==8.3.5",
    "pytest-cov==6.1.1",
]

[tool.setuptools.package-data]
"infield_fly.web" = ["templates/*.html", "static/*"]

[project.scripts]
infield-fly = "infield_fly.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["infield_fly"]

[tool.coverage.report]
show_missing = true
