[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "infield-fly"
# The version comes from the latest git tag, such as v1.0.0; see Releases in README.md.
dynamic = ["version"]
description = "An ffmpeg wrapper for media file container conversion"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "argcomplete>=3.3,<4",
    "deluge_client==1.9.0",
    "requests>=2.32.4,<3",
    "twilio==7.3.1",
]

[project.optional-dependencies]
web = [
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "python-pam>=2.0.2,<3",
    # python-pam imports six without declaring it as a dependency.
    "six>=1.16,<2",
    "starlette>=0.49,<1",
    "uvicorn>=0.39,<1",
    # Lets uvicorn serve WebSocket connections.
    "websockets>=13,<16",
]
dev = [
    "httpx>=0.28,<1",
    "pylint==3.3.9",
    "pytest==8.3.5",
    "pytest-cov==6.1.1",
]

[tool.setuptools_scm]
# Used when there is no git history to read the version from, such as an exported copy.
fallback_version = "0.0.0"

[tool.setuptools.package-data]
"infield_fly.web" = ["templates/*.html", "static/*"]

[project.scripts]
infield-fly = "infield_fly.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["infield_fly"]

[tool.coverage.report]
show_missing = true

# Pylint's design checks, with limits for this project. The tests have their own settings,
# in tests/pylintrc.
[tool.pylint.design]
# Positional arguments are kept to pylint's default, since they are identified only by
# their order at each call. Keyword-only arguments, after a *, are named at each call, so
# more of them are allowed in all.
max-positional-arguments = 5
max-args = 10
# Records, such as forms and the progress bar's settings, hold more values than pylint's
# default of 7.
max-attributes = 10
# Classes such as ASGI middleware have a single public method, __call__.
min-public-methods = 1
